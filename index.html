<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Project Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        .auth-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .auth-body {
            padding: 2rem;
        }
        .form-floating {
            margin-bottom: 1rem;
        }
        .btn-auth {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-auth:hover {
            background: linear-gradient(45deg, #5a6fd8, #6a4190);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .toggle-form {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .toggle-form:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-container fade-in">
        <!-- Login Form -->
        <div id="login-form" class="auth-form">
            <div class="auth-header">
                <h2>SimplePM - <i class="fas fa-sign-in-alt me-2"></i>Accedi</h2>
                <p class="mb-0 opacity-75">Bentornato! Accedi al tuo account</p>
            </div>
            <div class="auth-body">
                <form id="loginForm">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="login-username" placeholder="Username o Email" required>
                        <label for="login-username"><i class="fas fa-user me-2"></i>Username o Email</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="login-password" placeholder="Password" required>
                        <label for="login-password"><i class="fas fa-lock me-2"></i>Password</label>
                    </div>
                    <button type="submit" class="btn btn-auth btn-primary w-100 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Accedi
                    </button>
                </form>
                <div class="text-center">
                    <p>Non hai un account? <a href="#" class="toggle-form" onclick="showRegister()">Registrati qui</a><br>
                        <small> Test Email: mario.rossi@hotmail.it<br>Test Password: 30011978</small></p>
                </div>
            </div>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="auth-form" style="display: none;">
            <div class="auth-header">
                <h2>SimplePM - <i class="fas fa-user-plus me-2"></i>Registrati</h2>
                <p class="mb-0 opacity-75">Crea il tuo account per iniziare</p>
            </div>
            <div class="auth-body">
                <form id="registerForm">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="register-fullname" placeholder="Nome Completo" required>
                        <label for="register-fullname"><i class="fas fa-id-card me-2"></i>Nome Completo</label>
                    </div>
                    <div class="form-floating">
                        <input type="text" class="form-control" id="register-username" placeholder="Username" required>
                        <label for="register-username"><i class="fas fa-user me-2"></i>Username</label>
                    </div>
                    <div class="form-floating">
                        <input type="email" class="form-control" id="register-email" placeholder="Email" required>
                        <label for="register-email"><i class="fas fa-envelope me-2"></i>Email</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="register-password" placeholder="Password" required minlength="6">
                        <label for="register-password"><i class="fas fa-lock me-2"></i>Password (min 6 caratteri)</label>
                    </div>
                    <button type="submit" class="btn btn-auth btn-primary w-100 mb-3">
                        <i class="fas fa-user-plus me-2"></i>Registrati
                    </button>
                </form>
                <div class="text-center">
                    <p>Hai già un account? <a href="#" class="toggle-form" onclick="showLogin()">Accedi qui</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fas fa-check-circle me-2"></i>Successo</h5>
                </div>
                <div class="modal-body">
                    <p id="success-message"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" onclick="redirectToDashboard()">
                        <i class="fas fa-arrow-right me-2"></i>Vai alla Dashboard
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_URL = './api.php';

async function fetchJSON(data) {
try {
const response = await fetch(API_URL, {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify(data)
});
return await response.json();
} catch (error) {
console.error('Errore API:', error);
return {success: false, message: 'Errore di connessione'};
}
}

function showAlert(message, type = 'danger') {
const alertDiv = document.createElement('div');
alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
alertDiv.innerHTML = `
${message}
<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
`;
const container = document.querySelector('.auth-body');
container.insertBefore(alertDiv, container.firstChild);
setTimeout(() => {
alertDiv.remove();
}, 5000);
}

function showLogin() {
document.getElementById('login-form').style.display = 'block';
document.getElementById('register-form').style.display = 'none';
}

function showRegister() {
document.getElementById('login-form').style.display = 'none';
document.getElementById('register-form').style.display = 'block';
}

function redirectToDashboard() {
window.location.href = 'dashboard.php'; // Cambia con la tua pagina principale
}

// --- Gestione Login ---
document.getElementById('loginForm').addEventListener('submit', async (e) => {
e.preventDefault();

const username = document.getElementById('login-username').value.trim();
const password = document.getElementById('login-password').value.trim();

if (!username || !password) {
showAlert('Inserisci username e password');
return;
}

const result = await fetchJSON({
action: 'login',
username: username,
password: password
});

console.log('Risposta API:', result);

if (result.success) {
// Salva info utente nel localStorage
localStorage.setItem('currentUser', JSON.stringify(result.user));

// Reindirizza alla dashboard
redirectToDashboard();
} else {
showAlert(result.message || 'Errore durante il login');
}
});

// --- Gestione Registrazione (versione corretta) ---
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullName = document.getElementById('register-fullname').value.trim();
    const username = document.getElementById('register-username').value.trim();
    const email = document.getElementById('register-email').value.trim();
    const password = document.getElementById('register-password').value.trim();

    if (!fullName || !username || !email || !password) {
        showAlert('Tutti i campi sono obbligatori');
        return;
    }

    if (password.length < 6) {
        showAlert('La password deve essere di almeno 6 caratteri');
        return;
    }

    const result = await fetchJSON({
        action: 'register',
        fullName: fullName,
        username: username,
        email: email,
        password: password
        // Rimosso 'level' dal frontend - sarà impostato automaticamente dal backend come 'user'
    });

    if (result.success) {
        showAlert('Registrazione completata con successo!', 'success');
        setTimeout(() => {
            showLogin();
            document.getElementById('login-username').value = username;
        }, 1000);
    } else {
        showAlert(result.message || 'Errore durante la registrazione');
    }
});

// --- Check se utente già loggato al caricamento ---
window.addEventListener('load', () => {
    const currentUser = localStorage.getItem('currentUser');
    if (currentUser) {
        // Se trovate dati, reindirizza alla dashboard
        redirectToDashboard();
    }
});
        
// --- Funzione di Logout ---
function logout() {
localStorage.removeItem('currentUser');
// Se hai variabili di sessione/cookie, cancellale qui
window.location.href = 'index.html'; // pagina di login
}
</script>
</body>
</html>
